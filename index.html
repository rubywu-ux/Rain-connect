<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e8ebea">
<title>Connect the Rain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=fog29">
</head>
<body class="phone">
<canvas id="rain"></canvas>
<div class="vignette"></div>

<section id="world" class="world">
  <canvas id="map"></canvas>
  <button id="theme" class="theme-btn" aria-label="fog or night">night</button>
  <div class="world-text">
    <p class="eyebrow">right now, across the planet</p>
    <h1><span id="pct">—</span><span class="pct-sign">%</span></h1>
    <p class="lede" id="lede">of Earth is under rain</p>
    <p class="meta" id="meta">gathering the world's rain…</p>
  </div>
  <div class="world-foot">
    <p class="world-swipe">swipe to explore · tap a light</p>
    <p class="meta" id="shared"></p>
    <button id="enter" class="btn">catch the rain</button>
  </div>
</section>

<div id="hud" class="hud hidden">
  <div id="pill" class="pill">you are in the rain</div>
  <span class="hud-btns"><button id="wind" class="icon-btn" aria-label="Blow into your phone to make wind">≋</button>
  <button id="globe" class="icon-btn" aria-label="World rain map">◎</button>
  <button id="theme2" class="icon-btn" aria-label="fog or night">◐</button></span>
</div>
<p id="hint" class="hint hidden">Tap or drag the rain.<br>Tilt your phone and it leans.</p>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.15.2/dist/mqtt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="js/places.js?v=fog29"></script>
<script src="js/common.js?v=fog29"></script>
<script src="js/lab.js?v=fog29"></script>
<script src="js/phone.js?v=fog29"></script>
</body>
</html>
