<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connect the Rain — Wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=fog19">
</head>
<body class="wall">
<canvas id="rain"></canvas>
<div class="vignette"></div>
<div class="wall-map" id="wallmap" hidden><canvas id="map"></canvas></div>

<div class="wall-title">connect the rain<small>bring your phone close · join the rain</small></div>
<div class="wall-stats">
  <div class="big"><b id="pct">—</b><span>%</span></div>
  <p class="lede">of Earth is under rain right now</p>
  <p class="meta" id="meta">gathering the world's rain…</p>
</div>
<p class="art-line" id="artline"></p>
<p class="art-note" id="artnote"></p>
<div class="wall-qr"><div id="qr"></div><p>scan to join the rain</p></div>
<div class="netdot" id="netdot" title="relay connection"></div>
<div class="veil" id="veil"></div>
<div class="wall-btns"><button class="mist" id="mist" title="mist weather from the webcam (press W)">mist · off</button><button class="mist" id="art" title="rain map or umbrellas (press A)">rain map</button><button class="mist" id="theme" title="fog or night (press S)">fog</button></div>
<div class="start" id="start"><div><p>Click anywhere to begin</p><small>(starts sound, then press F for full screen)</small></div></div>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.15.2/dist/mqtt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@2.0.4/dist/qrcode.js"></script>
<script src="js/places.js?v=fog19"></script>
<script src="js/common.js?v=fog19"></script>
<script src="js/artmodes.js?v=fog19"></script>
<script src="js/wall.js?v=fog19"></script>
</body>
</html>
